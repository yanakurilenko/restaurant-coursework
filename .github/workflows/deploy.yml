name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker images
      run: docker-compose build

    - name: Test infrastructure
      run: |
        docker-compose up -d
        sleep 10
        curl -f http://localhost:80 || exit 1
        docker-compose down
